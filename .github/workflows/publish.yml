name: Publish downloads

on:
  workflow_dispatch:
    inputs:
      tag:
        description: edi release tag to publish, for example v2026.11.0 (empty for the latest)
        type: string
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Choose the release
        id: tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --repo enhantica/edi --json tagName --jq .tagName)
          fi
          gh release view "$TAG" --repo enhantica/edi --json isDraft --jq 'if .isDraft then error("draft") else . end' >/dev/null
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: enhantica/edi
          ref: ${{ steps.tag.outputs.tag }}
          path: edi
          sparse-checkout: |
            tools/release
            website
            data
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Download the release's repositories, feed and index inputs
        run: |
          gh release download "${{ steps.tag.outputs.tag }}" --repo enhantica/edi --dir assets \
            --pattern 'repository-stable-*.tar.gz' --pattern 'release.json' --pattern 'release-history.json' \
            --pattern 'SHA256SUMS'
          # The archives must be the bytes the release recorded.
          (cd assets && grep -E ' (repository-stable-.*\.tar\.gz|release\.json|release-history\.json)$' SHA256SUMS | sha256sum --check)
      - name: Build the site
        run: python build_site.py --edi edi --assets assets --output site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Mint a token for edi-sites
        id: sites-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ENHANTICA_APP_ID }}
          private-key: ${{ secrets.ENHANTICA_APP_KEY }}
          owner: enhantica
          repositories: edi-sites
      # The same files for download.easydiffraction.org, whose host pulls this branch of edi-sites through a
      # webhook. Each update is one commit on top of the last, so git sends only what changed.
      - name: Update the deploy-download branch
        env:
          SITES_TOKEN: ${{ steps.sites-token.outputs.token }}
        run: |
          remote="https://x-access-token:${SITES_TOKEN}@github.com/enhantica/edi-sites.git"
          work=$(mktemp -d)
          git -C "$work" init -q
          if git -C "$work" fetch -q --depth 1 "$remote" refs/heads/deploy-download 2>/dev/null; then
            git -C "$work" checkout -q --detach FETCH_HEAD
          else
            git -C "$work" checkout -q --orphan deploy-download
          fi
          rsync -a --delete --exclude .git site/ "$work"/
          cd "$work"
          git add -A
          if git rev-parse -q --verify HEAD >/dev/null && git diff --cached --quiet; then echo "up to date"; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Update the downloads"
          git push -q "$remote" HEAD:refs/heads/deploy-download

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        # The site is several hundred MB, and syncing it takes longer than the default ten minutes.
        with:
          timeout: 3600000
